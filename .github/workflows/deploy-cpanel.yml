name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        shell: bash
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          CPANEL_APP_DIR: ${{ vars.CPANEL_APP_DIR }}
          CPANEL_PHP_BIN: ${{ vars.CPANEL_PHP_BIN }}
          CPANEL_COMPOSER_BIN: ${{ vars.CPANEL_COMPOSER_BIN }}
          CPANEL_NPM_BIN: ${{ vars.CPANEL_NPM_BIN }}
        run: |
          set -Eeuo pipefail

          : "${CPANEL_SSH_HOST:?Add the CPANEL_SSH_HOST GitHub Actions secret}"
          : "${CPANEL_SSH_PORT:?Add the CPANEL_SSH_PORT GitHub Actions secret}"
          : "${CPANEL_SSH_USER:?Add the CPANEL_SSH_USER GitHub Actions secret}"
          : "${CPANEL_SSH_PRIVATE_KEY:?Add the CPANEL_SSH_PRIVATE_KEY GitHub Actions secret}"
          : "${CPANEL_SSH_KNOWN_HOSTS:?Add the CPANEL_SSH_KNOWN_HOSTS GitHub Actions secret}"
          : "${CPANEL_APP_DIR:?Add the CPANEL_APP_DIR repository variable}"

          if [[ ! "$CPANEL_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$CPANEL_SSH_PORT < 1 || 10#$CPANEL_SSH_PORT > 65535 )); then
            printf 'Error: CPANEL_SSH_PORT must be a valid TCP port.\n' >&2
            exit 1
          fi

          if [[ ! "$CPANEL_APP_DIR" =~ ^/[a-zA-Z0-9_./-]+$ || "$CPANEL_APP_DIR" == *"/../"* || "$CPANEL_APP_DIR" == */.. || "$CPANEL_APP_DIR" == *"/./"* || "$CPANEL_APP_DIR" == */. ]]; then
            printf 'Error: CPANEL_APP_DIR must be an absolute path without spaces or dot segments.\n' >&2
            exit 1
          fi

          for executable in "$CPANEL_PHP_BIN" "$CPANEL_COMPOSER_BIN" "$CPANEL_NPM_BIN"; do
            if [[ -n "$executable" && ! "$executable" =~ ^[a-zA-Z0-9_./+-]+$ ]]; then
              printf 'Error: deployment executable paths may contain only letters, numbers, and /._+-.\n' >&2
              exit 1
            fi
          done

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > "$HOME/.ssh/cpanel_deploy"
          chmod 600 "$HOME/.ssh/cpanel_deploy"
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          printf -v remote_command 'bash -s -- %q %q %q %q' \
            "$CPANEL_APP_DIR" "$CPANEL_PHP_BIN" "$CPANEL_COMPOSER_BIN" "$CPANEL_NPM_BIN"

          ssh \
            -i "$HOME/.ssh/cpanel_deploy" \
            -p "$CPANEL_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          cd -- "$1"
          [[ -z "$2" ]] || export PHP_BIN="$2"
          [[ -z "$3" ]] || export COMPOSER_BIN="$3"
          [[ -z "$4" ]] || export NPM_BIN="$4"
          exec bash ./deploy-cpanel.sh
          REMOTE
